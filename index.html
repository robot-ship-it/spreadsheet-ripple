
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rippling Spreadsheet Hero (Loop-ready, Transparent, Cropped)</title>
  <style>
    html, body { margin: 0; background: transparent; }

    .hero-anim{
      position: relative;
      width: 100%;
      height: 375px;       /* required height at 100% */
      overflow: hidden;
      pointer-events: none;
      background: transparent;
    }

    #c{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <div class="hero-anim">
    <canvas id="c"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ===== Animation =====
    const scrollSpeed = -0.14;
    const speed1 = -0.8;
    const freq1  = 2.5;
    const amp1   = 0.08;

    const subdivX = 220, subdivY = 110;

    // ===== Camera / framing =====
    const CAMERA_FOV   = 28 ; // was 20 (slightly zoomed in)
    const CAMERA_POS   = { x: 0, y: 2.35, z: 3.85 };
    const CAMERA_LOOK  = { x: 0, y: 0.25, z: 0 };

    const MESH_SCALE   = 1.32;
    const MESH_Y_SHIFT = -0.62; // push down so you mainly see wave tops

    // ===== Ensure bottom is flat for clean crop =====
    const FLAT_BOTTOM_START = -0.15;  // flatten begins
    const FLAT_BOTTOM_END   = -1.00;  // fully flat by here

    function smoothstep(edge0, edge1, x){
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    // ===== Table styling =====
    const PAPER_COLOR = '#242424'; // 80% black (20% white)

    const headers = ['Product', 'Sku', 'Units', 'Qty', 'Price', 'Net', 'Tax %', 'Tax Amt', 'Tot'];
    const headerAlign = ['left', 'center', 'center', 'center', 'right', 'right', 'center', 'right', 'right'];
    const dataAlign   = ['left', 'center', 'center', 'center', 'right', 'right', 'center', 'right', 'right'];

    // ===== Renderer =====
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.5));
    renderer.setClearColor(0x000000, 0);
    renderer.setClearAlpha(0); // guarantee transparent background

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.1, 100);
    camera.position.set(CAMERA_POS.x, CAMERA_POS.y, CAMERA_POS.z);
    camera.lookAt(CAMERA_LOOK.x, CAMERA_LOOK.y, CAMERA_LOOK.z);

    function resizeRenderer(){
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    // ===== Build table texture =====
    const tableCanvas = document.createElement('canvas');
    const W = 2048, H = 1024;
    tableCanvas.width = W;
    tableCanvas.height = H;
    const ctx = tableCanvas.getContext('2d');

    // paper fill
    ctx.fillStyle = PAPER_COLOR;
    ctx.fillRect(0, 0, W, H);

    const products = [
      { name: 'Product 1',  vals: ['216321', '2 PK', '50', '38.54',  '1927.00',  '13.0%', '250.51',  '2,177.51'] },
      { name: 'Product 4',  vals: ['546897', '2 PK', '75', '175.69', '13176.75', '13.0%', '1,712.98','14,889.73'] },
      { name: 'Product 9',  vals: ['456231', 'KG',   '65', '305.60', '19864.00', '10.0%', '1,986.40','21,850.40'] },
      { name: 'Product 6',  vals: ['455873', 'KG',   '34', '521.25', '17722.50', '10.0%', '1,772.25','19,494.75'] },
      { name: 'Product 16', vals: ['456892', 'EA',   '22', '693.96', '15267.12', '0.0%',  '0.00',   '15,267.12'] },
      { name: 'Product 9',  vals: ['546564', 'KG',   '75', '11.97',  '897.75',   '0.0%',  '0.00',   '897.75'] },
      { name: 'Product 12', vals: ['789455', 'EA',   '7',  '528.25', '3697.75',  '20.0%', '739.55', '4,437.30'] },
      { name: 'Product 18', vals: ['123002', 'CASE 24','31','216.00','6696.00',  '10.0%', '669.60', '7,365.60'] },
      { name: 'Product 6',  vals: ['564896', 'CASE 24','2', '707.39','1414.78',  '20.0%', '282.96', '1,697.74'] },
      { name: 'Product E1', vals: ['E-7765', '12 PK', '21','77.11',  '1619.31',  '20.0%', '323.86', '1,943.17'] },
      { name: 'Product L1', vals: ['L-12901','144 PK','33','821.84', '27120.72', '10.0%', '2,712.07','29,832.79'] },
      { name: 'Product L2', vals: ['L-66509','12 PK', '64','717.2',  '45900.80', '10.0%', '4,590.08','50,490.88'] }
    ];

    const cols = headers.length;
    const rows = products.length + 1;
    const cellW = W / cols;
    const cellH = H / rows;

    // Gridlines: pure white
    ctx.strokeStyle = 'rgba(255,255,255,1)';
    ctx.lineWidth = 3;
    for (let i = 0; i <= cols; i++){
      const x = i * cellW;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let j = 0; j <= rows; j++){
      const y = j * cellH;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Text: pure white
    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.textBaseline = 'middle';

    ctx.font = 'bold 48px sans-serif';
    headers.forEach((txt, i) => {
      const align = headerAlign[i];
      ctx.textAlign = align;
      let x = (i + 0.5) * cellW;
      if (align === 'left')  x = i * cellW + 0.1 * cellW;
      if (align === 'right') x = (i + 1) * cellW - 0.1 * cellW;
      ctx.fillText(txt, x, 0.5 * cellH);
    });

    ctx.font = '36px sans-serif';
    products.forEach((row, r) => {
      const align0 = dataAlign[0];
      ctx.textAlign = align0;
      let x0 = align0 === 'left' ? 0.1 * cellW : align0 === 'right' ? 0.9 * cellW : 0.5 * cellW;
      ctx.fillText(row.name, x0, (r + 1.5) * cellH);

      row.vals.forEach((val, vi) => {
        const ci = vi + 1;
        const align = dataAlign[ci];
        ctx.textAlign = align;
        let x = (ci + 0.5) * cellW;
        if (align === 'left')  x = ci * cellW + 0.1 * cellW;
        if (align === 'right') x = (ci + 1) * cellW - 0.1 * cellW;
        ctx.fillText(val, x, (r + 1.5) * cellH);
      });
    });

    // ===== Texture =====
    const tableTexture = new THREE.CanvasTexture(tableCanvas);
    tableTexture.wrapS = THREE.RepeatWrapping;
    tableTexture.wrapT = THREE.ClampToEdgeWrapping;

    tableTexture.generateMipmaps = true;
    tableTexture.minFilter = THREE.LinearMipmapLinearFilter;
    tableTexture.magFilter = THREE.LinearFilter;
    tableTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    tableTexture.repeat.set(3, 1);

    // ===== Geometry + Material =====
    const geom = new THREE.PlaneBufferGeometry(12, 2, subdivX * 3, subdivY);
    const origPos = geom.attributes.position.array.slice();

    const mat = new THREE.MeshBasicMaterial({
      map: tableTexture,
      transparent: true,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geom, mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.scale.set(MESH_SCALE, MESH_SCALE, MESH_SCALE);
    mesh.position.y = MESH_Y_SHIFT;
    scene.add(mesh);

    // ===== Animate =====
    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      const pos = geom.attributes.position.array;
      for (let i = 0; i < pos.length; i += 3){
        const x = origPos[i];
        const y = origPos[i + 1];

        // Mask wave near bottom to ensure a perfectly flat crop edge
        const waveMask = smoothstep(FLAT_BOTTOM_END, FLAT_BOTTOM_START, y);

        pos[i + 2] = Math.sin(((x + y) + t * speed1) * freq1) * amp1 * waveMask;
      }
      geom.attributes.position.needsUpdate = true;

      tableTexture.offset.x = ((-t * scrollSpeed / tableTexture.repeat.x) % 1 + 1) % 1;

      renderer.render(scene, camera);
    }

    resizeRenderer();
    animate();
    window.addEventListener('resize', resizeRenderer);
  </script>
</body>
</html>
