<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spreadsheet Ripple Embed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* Ensure true transparency everywhere */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    /* Outer crop container (what Google Sites sees) */
    .embed-crop {
      position: relative;
      width: 100%;
      height: 375px;
      overflow: hidden;
      background: transparent;
    }

    /* Animation container */
    .hero-anim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;               /* anchor to bottom */
      height: 375px;
      background: transparent;
      pointer-events: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <div class="embed-crop">
    <div class="hero-anim">
      <canvas id="c"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ===== Animation =====
    const scrollSpeed = -0.14;
    const speed1 = -0.8;
    const freq1  = 2.5;
    const amp1   = 0.08;

    const subdivX = 220, subdivY = 110;

    // ===== Camera / framing =====
    const CAMERA_FOV   = 28;
    const CAMERA_POS   = { x: 0, y: 2.35, z: 3.85 };
    const CAMERA_LOOK  = { x: 0, y: 0.25, z: 0 };

    const MESH_SCALE   = 1.32;
    const MESH_Y_SHIFT = -0.62;

    // ===== Bottom flatten =====
    const FLAT_BOTTOM_START = -0.15;
    const FLAT_BOTTOM_END   = -1.0;

    function smoothstep(e0, e1, x){
      const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    // ===== Renderer =====
    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.5));
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.1, 100);
    camera.position.set(CAMERA_POS.x, CAMERA_POS.y, CAMERA_POS.z);
    camera.lookAt(CAMERA_LOOK.x, CAMERA_LOOK.y, CAMERA_LOOK.z);

    function resize(){
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    // ===== Build table texture =====
    const tableCanvas = document.createElement('canvas');
    const W = 2048, H = 1024;
    tableCanvas.width = W;
    tableCanvas.height = H;
    const ctx = tableCanvas.getContext('2d');

    ctx.fillStyle = '#242424';
    ctx.fillRect(0, 0, W, H);

    const headers = ['Product','Sku','Units','Qty','Price','Net','Tax %','Tax Amt','Tot'];
    const rows = 13;
    const cellW = W / headers.length;
    const cellH = H / rows;

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;

    for (let i=0;i<=headers.length;i++){
      ctx.beginPath();
      ctx.moveTo(i*cellW,0);
      ctx.lineTo(i*cellW,H);
      ctx.stroke();
    }
    for (let j=0;j<=rows;j++){
      ctx.beginPath();
      ctx.moveTo(0,j*cellH);
      ctx.lineTo(W,j*cellH);
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 48px sans-serif';

    headers.forEach((h,i)=>{
      ctx.textAlign = i===0?'left':'center';
      const x = i===0? i*cellW+0.1*cellW:(i+0.5)*cellW;
      ctx.fillText(h,x,0.5*cellH);
    });

    ctx.font = '36px sans-serif';
    for(let r=1;r<rows;r++){
      ctx.textAlign='left';
      ctx.fillText(`Product ${r}`,0.1*cellW,(r+0.5)*cellH);
    }

    const texture = new THREE.CanvasTexture(tableCanvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.repeat.set(3,1);
    texture.minFilter = THREE.LinearMipmapLinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    // ===== Geometry =====
    const geom = new THREE.PlaneBufferGeometry(12,2,subdivX*3,subdivY);
    const base = geom.attributes.position.array.slice();

    const mesh = new THREE.Mesh(
      geom,
      new THREE.MeshBasicMaterial({ map:texture, transparent:true, side:THREE.DoubleSide })
    );

    mesh.rotation.x = -Math.PI/2;
    mesh.scale.set(MESH_SCALE,MESH_SCALE,MESH_SCALE);
    mesh.position.y = MESH_Y_SHIFT;
    scene.add(mesh);

    // ===== Animate =====
    const clock = new THREE.Clock();
    function animate(){
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const pos = geom.attributes.position.array;

      for(let i=0;i<pos.length;i+=3){
        const x = base[i];
        const y = base[i+1];
        const mask = smoothstep(FLAT_BOTTOM_END, FLAT_BOTTOM_START, y);
        pos[i+2] = Math.sin(((x+y)+t*speed1)*freq1)*amp1*mask;
      }

      geom.attributes.position.needsUpdate = true;
      texture.offset.x = ((-t*scrollSpeed/texture.repeat.x)%1+1)%1;
      renderer.render(scene,camera);
    }

    resize();
    animate();
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
